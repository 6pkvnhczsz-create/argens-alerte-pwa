name: Vigicrues backup to Cloudflare

# Cloudflare workers.dev requires a descriptive application User-Agent (error 1010).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vigicrues-backup-sync.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: vigicrues-backup-sync
  cancel-in-progress: false

jobs:
  sync-backup:
    name: Send signed Vigicrues snapshot to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch latest Vigicrues data and authenticate via GitHub OIDC
        run: python3 scripts/sync_vigicrues_backup.py

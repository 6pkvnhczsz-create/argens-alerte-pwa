name: Vigicrues backup to Cloudflare

# Cloudflare workers.dev requires a descriptive application User-Agent (error 1010).
# Discover active registered user stations from Cloudflare before each signed run.
# Unavailable stations are retried after a safe cooldown without blocking others.
# Transient Vigicrues timeouts/5xx are retried up to three times within a run.
# Permanent errors or exhausted retries still fail the run to preserve outage visibility.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vigicrues-backup-sync.yml'
      - 'scripts/sync_vigicrues_backup.py'
      - 'push-worker/src/vigicrues-snapshot.mjs'
      - 'push-worker/src/early-signals.mjs'
      - 'push-worker/src/index.js'

permissions:
  contents: read
  id-token: write

concurrency:
  group: vigicrues-backup-sync
  cancel-in-progress: false

jobs:
  sync-backup:
    name: Sync active and permanent upstream stations to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Discover active stations, fetch usable Vigicrues data and upload signed snapshots
        run: python3 scripts/sync_vigicrues_backup.py

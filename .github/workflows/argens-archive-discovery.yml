name: Research historical minute-level gauge archive (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/probe_instant_archive.py'
      - '.github/workflows/argens-archive-discovery.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official hydrometric archive metadata
        run: python3 research/probe_instant_archive.py

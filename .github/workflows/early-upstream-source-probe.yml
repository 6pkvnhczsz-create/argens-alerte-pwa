name: Check live Argens upstream sources

on:
  pull_request:
    paths:
      - 'push-worker/src/early-signals.mjs'
      - '.github/workflows/early-upstream-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check actual Hub Eau measurements without affecting flood alarms
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import urllib.parse
          import urllib.request
          stations = {
           'Y530501501':'Le Muy / Argens',
           'Y520201001':'Les Arcs / Aille',
           'Y523501001':'Trans en Provence / Nartuby'
          }
          for code,name in stations.items():
              url='https://hubeau.eaufrance.fr/api/v2/hydrometrie/observations_tr?'+urllib.parse.urlencode({
               'code_entite':code,'grandeur_hydro':'H','size':80,'sort':'desc','format':'json'})
              print('\nChecking',code,name,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'RiviereAlerteEarlySignals/1.0 (+https://riviere-alerte.fr)'})
                  with urllib.request.urlopen(req,timeout=18) as r:
                      status=r.status
                      result=json.load(r)
                  valid=[x for x in result.get('data',[]) if isinstance(x.get('resultat_obs'),(int,float)) and x.get('date_obs')]
                  print('HTTP',status,'valid observations',len(valid),flush=True)
                  if valid:
                      latest=max(valid,key=lambda x:x['date_obs'])
                      moment=dt.datetime.fromisoformat(latest['date_obs'].replace('Z','+00:00'))
                      age=(dt.datetime.now(dt.timezone.utc)-moment).total_seconds()/60
                      print('Last measurement UTC:',moment.isoformat(),'age minutes:',round(age,1),'level_mm:',latest['resultat_obs'],flush=True)
                      print('LIVE STATUS:','USABLE' if -15<=age<=180 and len(valid)>=2 else 'STALE/INCOMPLETE',flush=True)
                  else:
                      print('LIVE STATUS: NO_DATA',flush=True)
              except Exception as e:
                  print('LIVE STATUS:',type(e).__name__,str(e)[:250],flush=True)
          PY

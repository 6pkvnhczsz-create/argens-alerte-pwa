name: Early signal sources and public indicators

on:
  pull_request:
    paths:
      - 'push-worker/src/early-signals.mjs'
      - 'push-worker/src/long-range-forecast.mjs'
      - 'push-worker/test/long-range-forecast.test.mjs'
      - 'push-worker/src/observed-argens-rain.mjs'
      - 'push-worker/src/measured-rain.mjs'
      - 'push-worker/test/measured-rain.test.mjs'
      - 'push-worker/test/observed-argens-rain.test.mjs push-worker/test/measured-rain.test.mjs'
      - 'push-worker/src/index.js'
      - 'push-worker/test/early-signals.test.mjs'
      - 'index.html'
      - '.github/workflows/early-signals-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check official warnings, rainfall, upstream trends and untouched alert thresholds
        run: |
          node --check push-worker/src/observed-argens-rain.mjs
          node --check push-worker/src/measured-rain.mjs
          node --check push-worker/src/long-range-forecast.mjs
          node --test push-worker/test/early-signals.test.mjs push-worker/test/water-sources.test.mjs push-worker/test/observed-argens-rain.test.mjs push-worker/test/long-range-forecast.test.mjs

name: France home station maps live smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/france-maps-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check both independent home-station forecast bounds and PNG
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,time
          base='https://argens-alerte-push.p-hammerschmidt.workers.dev'
          headers={'User-Agent':'RiviereAlerteRadarSync/1.0 (+https://riviere-alerte.fr)',
                   'Origin':'https://riviere-alerte.fr','Accept':'application/json'}
          previous=None
          for attempt in range(10):
            try:
              def metadata(code):
                u=base+'/api/piaf/metadata?station='+code
                with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=28) as res:
                  return json.load(res)
              roquebrune=metadata('Y531201001')
              toulouse=metadata('O200004001')
              assert roquebrune.get('station',{}).get('code')=='Y531201001'
              assert roquebrune.get('bounds')==[5.6331,42.8097,7.6331,44.0897]
              st=toulouse.get('station',{})
              assert st.get('code')=='O200004001',st
              assert 43.4<float(st['lat'])<43.8 and 1.2<float(st['lon'])<1.7,st
              box=toulouse['bounds']
              assert box[0]<float(st['lon'])<box[2] and box[1]<float(st['lat'])<box[3],box
              assert box!=roquebrune['bounds'],'User station did not change map'
              first=toulouse['frames'][0]
              url=base+'/api/piaf/frame?'+urllib.parse.urlencode({
               'station':st['code'],'time':first,'run':toulouse['referenceTime']})
              with urllib.request.urlopen(urllib.request.Request(url,headers={**headers,'Accept':'image/png'}),timeout=35) as image:
                buf=image.read(1500001);mime=image.headers.get('Content-Type')
              assert mime=='image/png' and buf.startswith(bytes([137,80,78,71,13,10,26,10])),mime
              assert (int.from_bytes(buf[16:20],'big'),int.from_bytes(buf[20:24],'big'))==(720,500)
              print('PASS TWO DIFFERENT REAL FRENCH STATIONS',roquebrune['station']['code'],toulouse['station']['code'])
              print('TOULOUSE VIEW',box,'first frame',first,'real PNG bytes',len(buf))
              break
            except Exception as error:
              previous=str(error);print('Station-specific PIAF attempt',attempt+1,previous[:200])
              if attempt==9:raise
              time.sleep(10)
          # Official directed graph is optional and explicitly fail-closed.
          # Report a missing graph without declaring nonexistent gauges upstream.
          u=base+'/api/upstream/stations?station=O200004001'
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=40) as res:
              data=json.load(res)
            assert data.get('hydrologicalConnectivity')=='directed_verified_local_only'
            assert data.get('home',{}).get('code')=='O200004001'
            print('LOCAL TOPAGE STATUS',data['status'],'verified current gauges',len(data.get('stations',[])))
          except urllib.error.HTTPError as e:
            print('LOCAL TOPAGE NOT VERIFIED',e.code,e.read(120).decode('utf-8','replace'))
          PY

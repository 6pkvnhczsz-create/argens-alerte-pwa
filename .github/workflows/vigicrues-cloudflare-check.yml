name: Check Vigicrues Cloudflare backup receipt

on:
  pull_request:
    paths:
      - '.github/workflows/vigicrues-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify signed Vigicrues readings reached Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Cloudflare backup API for genuine GitHub Actions snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import time
          import urllib.request
          import urllib.error

          url = 'https://argens-alerte-push.p-hammerschmidt.workers.dev/api/vigicrues-backup?station=Y531201001'
          for attempt in range(1, 13):
              print(f"Probe {attempt}/12", flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json'}),timeout=15) as response:
                      body = json.load(response)
                      print("HTTP:",response.status,"source:",body.get('source'),"transport:",body.get('transport'),"station:",body.get('station'),flush=True)
                      observed = dt.datetime.fromisoformat(body.get('observed_at','').replace('Z','+00:00'))
                      age = (dt.datetime.now(dt.timezone.utc)-observed).total_seconds()/60
                      print(f"Latest measurement UTC: {observed.isoformat()}, age: {age:.1f} min, samples: {len(body.get('data',[]))}",flush=True)
                      if body.get('ok') and body.get('source')=='vigicrues' and body.get('transport')=='github-actions' and body.get('station')=='Y531201001' and -15<=age<=180 and len(body.get('data',[]))>=2:
                          print("PASS: Signed GitHub Actions snapshot received in Cloudflare and is fresh",flush=True)
                          break
              except urllib.error.HTTPError as error:
                  print(f"Cloudflare HTTP {error.code}; response: {error.read(700).decode('utf-8',errors='replace')}",flush=True)
              except Exception as error:
                  print(f"Read error: {type(error).__name__}: {str(error)[:200]}",flush=True)
              if attempt == 12:
                  raise SystemExit("FAIL: No fresh GitHub Actions snapshot reached Cloudflare")
              time.sleep(10)
          PY

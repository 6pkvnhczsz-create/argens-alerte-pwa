name: PIAF RGB palette diagnostic (read-only)
on:
  pull_request:
    paths: ['.github/workflows/piaf-palette-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Read current PIAF RGB shades from public forecast PNG
        run: |
          python - <<'PY'
          import json,urllib.request,io,collections
          from PIL import Image
          from urllib.parse import quote
          base='https://argens-alerte-push.p-hammerschmidt.workers.dev/api/piaf'
          h={'User-Agent':'RiviereAlerteRadarSync/1.0 (+https://riviere-alerte.fr)','Origin':'https://riviere-alerte.fr'}
          with urllib.request.urlopen(urllib.request.Request(base+'/metadata',headers=h),timeout=30) as res:meta=json.load(res)
          print('STYLE',meta.get('style'),'LAYER',meta.get('layer'),'TIMES',len(meta['frames']))
          picks=[meta['frames'][i] for i in sorted(set([0,len(meta['frames'])//3,2*len(meta['frames'])//3,len(meta['frames'])-1]))]
          for t in picks:
            req=urllib.request.Request(base+'/frame?time='+quote(t,safe=''),headers=h)
            with urllib.request.urlopen(req,timeout=30) as res:im=Image.open(io.BytesIO(res.read())).convert('RGBA')
            colors=collections.Counter(im.getdata())
            opaque=sum(n for (r,g,b,a),n in colors.items() if a>10)
            print('TIME',t,'pixels',im.size,'unique',len(colors),'nontransparent',opaque)
            for c,n in colors.most_common(55):print('COLOR',c,'COUNT',n)
          PY

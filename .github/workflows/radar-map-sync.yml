name: Météo-France radar map for Argens

# Produces a georeferenced rainfall image, never a flood alert.
# 15-minute cadence reduces GitHub Actions minutes and Météo-France traffic.
# The Cloudflare Worker holds the private API key; GitHub requests short-lived
# OIDC identities scoped to this exact main-branch workflow.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-map-sync.yml'
      - 'scripts/sync_meteo_radar_map.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: radar-map-sync
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated raster processing dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'pyproj>=3.6,<4'
      - name: Validate source projection and publish the measured map
        run: python scripts/sync_meteo_radar_map.py
      - name: Probe the new PIAF subscription (metadata only, on code update)
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json,os,sys,urllib.request,urllib.error,time
          sys.path.insert(0,'scripts')
          from sync_meteo_radar_map import identity_token
          endpoint='https://argens-alerte-push.p-hammerschmidt.workers.dev/api/radar-map/piaf-probe'
          for attempt in range(6):
            req=urllib.request.Request(endpoint,headers={
              'Authorization':'Bearer '+identity_token(),
              'Accept':'application/json',
              'User-Agent':'RiviereAlertePIAFProbe/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=40) as response:
                data=json.load(response)
              print('PIAF subscription probe:',json.dumps(data,ensure_ascii=False))
              assert data.get('ok') is True
              results=data.get('answers',[])
              if len(results)>2 or any(item.get('catalogue') for item in results):
                print('Enhanced PIAF diagnostic response received.')
                break
              if attempt==5:
                print('PIAF diagnostic Worker has not updated yet; no forecast connection is claimed.')
                break
              print('Waiting for the read-only PIAF probe deployment before retesting.')
              time.sleep(12)
            except urllib.error.HTTPError as ex:
              print('PIAF probe availability status',ex.code)
              if ex.code not in (404,503) or attempt==5:raise
              time.sleep(10)
          PY
      - name: Verify official preview exists (public metadata only)
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request
          req=urllib.request.Request(
            'https://argens-alerte-push.p-hammerschmidt.workers.dev/api/radar-map/info',
            headers={'User-Agent':'RiviereAlerteRadarSync/1.0 (+https://riviere-alerte.fr)','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=15) as res:
            data=json.load(res)
          print('Status:',res.status,'available:',data.get('available'),'observedAt:',data.get('observedAt'),'source:',data.get('source'))
          assert data.get('available') is True and data.get('source')=='Météo-France'
          # Check the actual public PNG with a real browser origin, not just JSON metadata.
          image_url='https://argens-alerte-push.p-hammerschmidt.workers.dev/api/radar-map/image'
          image_req=urllib.request.Request(image_url,headers={
            'Accept':'image/png','Origin':'https://riviere-alerte.fr',
            'User-Agent':'RiviereAlerteRadarSync/1.0 (+https://riviere-alerte.fr)'})
          with urllib.request.urlopen(image_req,timeout=20) as image_response:
            blob=image_response.read(480001)
            mime=image_response.headers.get('Content-Type','')
            allow=image_response.headers.get('Access-Control-Allow-Origin')
          assert mime=='image/png' and allow=='https://riviere-alerte.fr'
          assert blob.startswith(b'\x89PNG\r\n\x1a\n') and len(blob)<=480000
          width=int.from_bytes(blob[16:20],'big')
          height=int.from_bytes(blob[20:24],'big')
          assert (width,height)==(720,500)
          print('PUBLIC MAP: valid PNG',width,'x',height,'bytes:',len(blob),'CORS:',allow)
          PY

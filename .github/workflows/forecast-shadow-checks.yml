name: Forecast shadow admin checks
on:
  pull_request:
    paths:
      - 'admin-worker/**'
      - '.github/workflows/forecast-shadow-checks.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxprüfung
        run: |
          node --check admin-worker/src/index.js
          node --check admin-worker/src/forecast-shadow.js
          node --check admin-worker/src/forecast-shadow-comparison.js
          node --check admin-worker/src/forecast-shadow-schedule.js
      - name: Unit tests
        run: node --test admin-worker/test/forecast-shadow.test.mjs

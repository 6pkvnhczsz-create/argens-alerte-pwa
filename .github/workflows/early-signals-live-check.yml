name: Check live early indicators endpoint

on:
  pull_request:
    paths:
      - '.github/workflows/early-signals-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Cloudflare serves real Argens early indicator snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import time
          import urllib.error
          import urllib.request
          url='https://argens-alerte-push.p-hammerschmidt.workers.dev/api/early-signals'
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'RiviereAlerteDiagnostics/1.0 (+https://riviere-alerte.fr)'})
          for attempt in range(1,7):
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=json.load(response)
                      print('HTTP:',response.status,'station:',data.get('station'),'information_only:',data.get('interpretation'),flush=True)
                  assert data.get('ok') is True
                  assert data.get('station')=='Y531201001'
                  assert data.get('changesFloodThresholds') is False
                  print('Checked UTC:',data.get('checkedAt'),'official status:',data.get('official',{}).get('status'),flush=True)
                  # Never log credentials: diagnostic covers status, published time and validation only.
                  official=data.get('official') or {}
                  print('METEO FRANCE: status:',official.get('status'),'bulletin updated:',official.get('updatedAt'),'period count:',len(official.get('periods') or []),'department:',official.get('department'),'safe diagnostic:',official.get('diagnostic'),flush=True)
                  radar=data.get('radar') or {}
                  print('METEO FRANCE RADAR: status:',radar.get('status'),'observed UTC:',radar.get('observedAt'),'safe diagnostic:',radar.get('diagnostic'),'measurements available:',radar.get('measurementAvailable'),flush=True)
                  for row in data.get('forecast',[]):
                      print('METEO FRANCE FORECAST:',row.get('id'),row.get('status'),'next 6h:',row.get('next6hMm'),'next 24h:',row.get('next24hMm'),flush=True)
                  for row in data.get('upstream',[]):
                      print('UPSTREAM:',row.get('code'),row.get('status'),'last:',row.get('observedAt'),'trend:',row.get('trendCmH'),flush=True)
                  for row in data.get('rain',[]):
                      print('RAIN MODEL:',row.get('id'),row.get('status'),'3h:',row.get('last3hMm'),'6h:',row.get('last6hMm'),flush=True)
                  print('PASS: Current early-indicators endpoint available, original flood logic untouched',flush=True)
                  break
              except urllib.error.HTTPError as e:
                  print('Attempt',attempt,'HTTP',e.code,'response:',e.read(250).decode(errors='replace'),flush=True)
              except Exception as e:
                  print('Attempt',attempt,type(e).__name__,str(e)[:250],flush=True)
              if attempt==6: raise SystemExit('FAIL: No current early-indicators snapshot served by Cloudflare')
              time.sleep(10)
          PY

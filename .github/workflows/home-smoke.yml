name: Homepage interactive smoke test
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/home-smoke.mjs'
      - 'scripts/forecast-map-smoke.mjs'
      - '.github/workflows/home-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26
      - name: Load homepage, load water level, and click all five tabs
        run: node scripts/home-smoke.mjs
      - name: Open forecast lists and show five officially positioned upstream pins
        run: node scripts/forecast-map-smoke.mjs

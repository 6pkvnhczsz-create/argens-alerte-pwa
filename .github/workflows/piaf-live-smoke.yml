name: PIAF live forecast PNG check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/piaf-live-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published PIAF metadata and first genuine forecast frame
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error,datetime
          base='https://argens-alerte-push.p-hammerschmidt.workers.dev/api/piaf'
          last=None
          for attempt in range(3):
            try:
              req=urllib.request.Request(base+'/metadata',headers={'Accept':'application/json','Origin':'https://riviere-alerte.fr','User-Agent':'RiviereAlerteRadarSync/1.0 (+https://riviere-alerte.fr)'})
              with urllib.request.urlopen(req,timeout=28) as response:
                data=json.load(response)
              assert data.get('ok') and data.get('available') and data.get('kind')=='forecast_5min',data
              frames=data.get('frames',[])
              assert frames and len(frames)<=37,(len(frames),data.get('referenceTime'))
              frame=frames[0]
              from urllib.parse import quote
              image_req=urllib.request.Request(base+'/frame?time='+quote(frame,safe=''),headers={'Accept':'image/png','Origin':'https://riviere-alerte.fr','User-Agent':'RiviereAlerteRadarSync/1.0 (+https://riviere-alerte.fr)'})
              with urllib.request.urlopen(image_req,timeout=28) as response:
                blob=response.read(1500001)
                mimetype=response.headers.get('Content-Type','')
              assert mimetype=='image/png',mimetype
              assert blob.startswith(b'\x89PNG\r\n\x1a\n') and len(blob)<=1500000,len(blob)
              assert (int.from_bytes(blob[16:20],'big'),int.from_bytes(blob[20:24],'big'))==(720,500)
              print('PASS official PIAF',data['referenceTime'],'first valid time',frame,'frames',len(frames),'png bytes',len(blob))
              legend_req=urllib.request.Request(base+'/legend',headers={'Accept':'image/png','Origin':'https://riviere-alerte.fr','User-Agent':'RiviereAlerteRadarSync/1.0 (+https://riviere-alerte.fr)'})
              try:
                with urllib.request.urlopen(legend_req,timeout=28) as legend_response:
                  legend=legend_response.read(1500001)
                  legend_type=legend_response.headers.get('Content-Type','')
                assert legend_type=='image/png' and legend.startswith(blob[:8])
                print('PASS official same-style PIAF legend',len(legend),'bytes')
              except urllib.error.HTTPError as legend_error:
                print('OFFICIAL PIAF LEGEND UNAVAILABLE',legend_error.code,legend_error.read(200).decode('utf-8','replace'))
              break
            except urllib.error.HTTPError as ex:
              last='HTTP '+str(ex.code)
              detail=ex.read(500).decode('utf-8','replace')
              print('PIAF live attempt',attempt+1,last,'response:',detail[:400], 'server:',ex.headers.get('Server'))
              if attempt==2:raise
              time.sleep(3)
            except Exception as ex:
              last=str(ex)
              print('PIAF live attempt',attempt+1,':',last[:350])
              if attempt==2:raise
              time.sleep(3)
          PY

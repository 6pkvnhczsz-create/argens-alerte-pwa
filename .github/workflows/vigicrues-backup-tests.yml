name: Vigicrues backup regression checks

on:
  pull_request:
    paths:
      - 'push-worker/src/vigicrues-snapshot.mjs'
      - 'push-worker/src/index.js'
      - 'scripts/tests/**'
      - '.github/workflows/vigicrues-backup-sync.yml'
      - 'push-worker/src/water-sources.mjs'
      - 'push-worker/test/vigicrues-snapshot.test.mjs'
      - 'scripts/sync_vigicrues_backup.py'
      - '.github/workflows/vigicrues-backup-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Check Python sync script syntax
        run: python3 -m py_compile scripts/sync_vigicrues_backup.py
      - name: Test dynamic station selection and per-station payloads
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Test backup verification, data freshness, and primary-fallback routing
        run: node --test push-worker/test/vigicrues-snapshot.test.mjs push-worker/test/water-sources.test.mjs

name: Official Météo-France radar map regression checks

on:
  pull_request:
    paths:
      - 'push-worker/src/radar-map.mjs'
      - 'push-worker/src/piaf-map.mjs'
      - 'push-worker/test/piaf-map.test.mjs'
      - 'piaf-player.js'
      - 'push-worker/src/index.js'
      - 'push-worker/test/radar-map.test.mjs'
      - 'scripts/sync_meteo_radar_map.py'
      - 'scripts/test_meteo_radar_map.py'
      - '.github/workflows/radar-map-sync.yml'
      - 'index.html'
      - '.github/workflows/radar-map-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker identity, PNG checks and browser fallback
        run: node --test push-worker/test/radar-map.test.mjs push-worker/test/early-signals.test.mjs push-worker/test/piaf-map.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline radar test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'h5py>=3.10,<4' 'pillow>=10,<13' 'pyproj>=3.6,<4'
      - name: Validate geo-referencing, clipping, rainfall scaling and fallback
        run: python scripts/test_meteo_radar_map.py
